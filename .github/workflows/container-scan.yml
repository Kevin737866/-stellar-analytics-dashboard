name: Container Vulnerability Scan

on:
  push:
    branches: [ main, develop ]
    paths:
      - '**/Dockerfile*'
      - '**/docker-compose*.yml'
      - 'api/**'
      - 'indexer/**'
      - 'shared/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - '**/Dockerfile*'
      - '**/docker-compose*.yml'
      - 'api/**'
      - 'indexer/**'
      - 'shared/**'
  schedule:
    # Run nightly at 2 AM UTC for security updates
    - cron: '0 2 * * *'

jobs:
  trivy-scan:
    name: Trivy Container Vulnerability Scan
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # v0.28.0
        with:
          # Scan mode: image (requires Docker build) or filesystem (no build needed)
          scan-type: 'filesystem'
          # Scan options
          scan-dev-deps: 'true'
          # Severity levels to report (CRITICAL, HIGH, MEDIUM, LOW, UNKNOWN)
          severity: 'CRITICAL,HIGH'
          # Output format
          format: 'sarif'
          # Output file
          output-file: 'trivy-results.sarif'
          # Ignore unfixed vulnerabilities
          ignore-unfixed: 'true'
          # Cache directory
          cache-dir: '/tmp/trivy-cache'

      - name: Upload Trivy results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v3
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Generate scan summary
        if: always()
        run: |
          echo "### Container Vulnerability Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Scan Type**: Filesystem (no Docker build required)" >> $GITHUB_STEP_SUMMARY
          echo "- **Severity Levels**: CRITICAL, HIGH" >> $GITHUB_STEP_SUMMARY
          echo "- **Scan Mode**: Dev dependencies included" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f "trivy-results.sarif" ]; then
            # Count vulnerabilities
            CRITICAL=$(grep -o '"severity": *"Critical"' trivy-results.sarif | wc -l || echo "0")
            HIGH=$(grep -o '"severity": *"High"' trivy-results.sarif | wc -l || echo "0")
            TOTAL=$((CRITICAL + HIGH))
            
            echo "- **Critical**: $CRITICAL" >> $GITHUB_STEP_SUMMARY
            echo "- **High**: $HIGH" >> $GITHUB_STEP_SUMMARY
            echo "- **Total**: $TOTAL" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            if [ "$TOTAL" -gt 0 ]; then
              echo "⚠️ Vulnerabilities detected - review in Security tab" >> $GITHUB_STEP_SUMMARY
            else
              echo "✅ No critical or high vulnerabilities found" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "⚠️ No scan results available" >> $GITHUB_STEP_SUMMARY
          fi

  dockerfile-lint:
    name: Dockerfile Lint
    timeout-minutes: 5
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run Hadolint Dockerfile linter
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: './Dockerfile'
          config: './.hadolint.yaml'
          # Severity levels: error, warning, info
          failure-threshold: 'warning'

      - name: Generate lint summary
        if: always()
        run: |
          echo "### Dockerfile Lint Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Tool**: Hadolint" >> $GITHUB_STEP_SUMMARY
          echo "- **Severity Threshold**: warning" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Dockerfile best practices checked:" >> $GITHUB_STEP_SUMMARY
          echo "- Use non-root user" >> $GITHUB_STEP_SUMMARY
          echo "- Avoid secrets in build" >> $GITHUB_STEP_SUMMARY
          echo "- Pin base image versions" >> $GITHUB_STEP_SUMMARY
          echo "- Use multi-stage builds" >> $GITHUB_STEP_SUMMARY

  docker-compose-lint:
    name: Docker Compose Lint
    timeout-minutes: 5
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate Docker Compose files
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.dev.yml config --quiet

      - name: Generate compose lint summary
        if: always()
        run: |
          echo "### Docker Compose Lint Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Tool**: docker compose config" >> $GITHUB_STEP_SUMMARY
          echo "- **Files**: docker-compose.yml, docker-compose.dev.yml" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Validates Compose file syntax and resolves the full project config." >> $GITHUB_STEP_SUMMARY
