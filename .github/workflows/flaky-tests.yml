name: Flaky Test Detection

# Identifies and isolates unstable tests instead of letting them block releases.
#
# Strategy
#   1. Run all non-visual E2E specs with --repeat-each=3 under
#      QUARANTINE_MODE=run-quarantined (so quarantined tests are NOT skipped).
#   2. FlakyReporter tracks pass/fail counts across all attempts.
#   3. promote-flaky.ts compares the report against flaky.json and adds
#      newly discovered flaky tests to the quarantine list.
#   4. If any new tests were added a PR is opened automatically.
#   5. In the standard CI run (`ci.yml`) quarantined tests are skipped via
#      the quarantine fixture so they cannot block releases.
#
# Schedule: runs nightly on main + on every PR that touches test files.

on:
  schedule:
    # 02:00 UTC every night — low-traffic window, less CI runner contention
    - cron: '0 2 * * *'
  push:
    branches: [main, develop]
    paths:
      - 'packages/e2e/tests/**'
      - 'packages/e2e/flaky.json'
      - 'packages/e2e/playwright.config.ts'
      - '.github/workflows/flaky-tests.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'packages/e2e/tests/**'
      - 'packages/e2e/flaky.json'
  workflow_dispatch:
    inputs:
      repeat_each:
        description: 'How many times to repeat each test'
        required: false
        default: '3'
        type: string

jobs:
  flaky-detection:
    name: Flaky Detection (repeat-each=${{ inputs.repeat_each || 3 }})
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: stellar_analytics_test
          POSTGRES_USER: stellar_user
          POSTGRES_PASSWORD: stellar_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.12.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium only
        run: pnpm --filter @stellar-analytics/e2e exec playwright install chromium --with-deps

      - name: Build packages
        run: pnpm build
        env:
          CI: true

      - name: Start API server
        run: |
          pnpm --filter @stellar-analytics/api dev &
          sleep 8
        env:
          DATABASE_URL: postgres://stellar_user:stellar_password@localhost:5432/stellar_analytics_test
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test
          PORT: 4000

      - name: Start Frontend dev server
        run: |
          pnpm --filter @stellar-analytics/frontend dev &
          sleep 8
        env:
          VITE_GRAPHQL_URL: http://localhost:4000/graphql

      # Run all functional specs (not visual) with --repeat-each so each test
      # executes multiple times.  QUARANTINE_MODE=run-quarantined ensures tests
      # in flaky.json are NOT skipped here — we want to observe their behaviour.
      - name: Run tests with repeat-each
        id: run_tests
        run: |
          REPEAT=${{ inputs.repeat_each || 3 }}
          pnpm --filter @stellar-analytics/e2e exec playwright test \
            --project=flaky-detection \
            --repeat-each=$REPEAT \
            --reporter=list \
            --reporter=junit \
            --reporter=./reporters/flaky-reporter
        env:
          BASE_URL: http://localhost:5173
          QUARANTINE_MODE: run-quarantined
          CI: true
        # Always continue so we can publish the report even if tests fail
        continue-on-error: true

      # Check whether any new flaky tests need promoting to flaky.json
      - name: Promote new flaky tests to quarantine list
        id: promote
        run: |
          pnpm --filter @stellar-analytics/e2e exec ts-node scripts/promote-flaky.ts \
            --report test-results/flaky-report.json \
            --list flaky.json
          echo "exit_code=$?" >> $GITHUB_OUTPUT
        continue-on-error: true
        working-directory: packages/e2e

      # If promote-flaky wrote new entries, open an automated PR
      - name: Open PR with updated quarantine list
        if: steps.promote.outputs.exit_code == '1'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'test(flaky): auto-quarantine newly detected flaky tests'
          title: 'chore: quarantine newly detected flaky tests'
          body: |
            ## Flaky Tests Detected

            The nightly flaky-detection run found tests that are inconsistently
            passing or failing.  They have been added to `packages/e2e/flaky.json`
            so they are **skipped in the standard CI pipeline** and no longer
            block releases.

            ### Next steps
            1. Review the entries added to `flaky.json`.
            2. Open a separate issue for each test and link it via the `issueUrl` field.
            3. Fix the underlying flakiness and remove the entry to graduate the test.

            > Flaky report artefact attached to the workflow run.
          branch: chore/quarantine-flaky-tests
          labels: 'flaky-tests, automated, quality'
          add-paths: packages/e2e/flaky.json

      # Post a summary comment on PRs
      - name: Comment on PR with flaky test summary
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = 'packages/e2e/test-results/flaky-report.json';
            if (!fs.existsSync(reportPath)) return;

            const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
            const flakyTests  = report.tests.filter(t => t.status === 'flaky');
            const failingTests = report.tests.filter(t => t.status === 'always-failing');

            const icon = flakyTests.length === 0 && failingTests.length === 0 ? '✅' : '⚠️';
            const lines = [
              '## Flaky Test Detection Report',
              `${icon} **${report.totalTests}** tests · **${report.flakyCount}** flaky · **${report.alwaysFailingCount}** always-failing`,
            ];

            if (flakyTests.length > 0) {
              lines.push('', '### Flaky tests (inconsistent results)');
              flakyTests.forEach(t =>
                lines.push(`- \`${t.title}\` — passed **${t.passed}/${t.attempts}** attempts`)
              );
            }

            if (failingTests.length > 0) {
              lines.push('', '### Always-failing tests');
              failingTests.forEach(t => lines.push(`- \`${t.title}\``));
            }

            if (flakyTests.length === 0 && failingTests.length === 0) {
              lines.push('', '> All tests produced consistent results across all repeat runs.');
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: lines.join('\n'),
            });

      # Always upload artefacts for inspection
      - name: Upload flaky report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flaky-detection-report
          path: |
            packages/e2e/test-results/flaky-report.json
            packages/e2e/test-results/junit.xml
            packages/e2e/playwright-report/
          retention-days: 30

  # ── Quarantine gate ────────────────────────────────────────────────────────
  # Runs in every CI pipeline (not just the nightly one) and enforces that
  # no quarantined test is accidentally removed from flaky.json without the
  # corresponding fix being proven stable first.
  quarantine-gate:
    name: Quarantine Gate (validate flaky.json)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Validate flaky.json structure
        run: |
          node - <<'JS'
          const fs = require('fs');
          const raw = fs.readFileSync('packages/e2e/flaky.json', 'utf8');
          let list;
          try { list = JSON.parse(raw); } catch (e) {
            console.error('flaky.json is not valid JSON:', e.message);
            process.exit(1);
          }
          if (!Array.isArray(list.quarantined)) {
            console.error('flaky.json must have a "quarantined" array');
            process.exit(1);
          }
          const required = ['title', 'file', 'reason', 'quarantinedAt', 'quarantinedBy'];
          for (const entry of list.quarantined) {
            for (const field of required) {
              if (!entry[field]) {
                console.error(`Entry "${entry.title || '(unknown)'}" is missing required field: ${field}`);
                process.exit(1);
              }
            }
          }
          console.log(`flaky.json is valid. Quarantined tests: ${list.quarantined.length}`);
          JS
